<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${developer?.name + ' — GameHub'}">GameHub</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #1a1a2e; color: #e0e0e0; }
        .header { background: #16213e; padding: 15px 30px; border-bottom: 2px solid #0f3460; }
        .header h1 { margin: 0; color: #e94560; }
        .content { padding: 30px; max-width: 700px; }
        .card { background: #16213e; border-radius: 8px; padding: 25px; }
        .field { margin: 12px 0; }
        .label { color: #9cdcfe; font-size: 0.85em; margin-bottom: 3px; }
        .rating { color: #ffd700; font-size: 2em; font-weight: bold; }
        .btn { padding: 8px 16px; background: #0f3460; color: white; text-decoration: none; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="header"><h1>🎮 GameHub</h1></div>
    <div class="content" th:if="${developer}">
        <a href="/developers" class="btn" style="margin-bottom:20px; display:inline-block;">← Назад</a>
        <div class="card">
            <h2 th:text="${developer.name}" style="color:#e94560; margin-top:0;"></h2>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:15px;">
                <div class="field"><div class="label">Страна</div><div th:text="${developer.country}"></div></div>
                <div class="field"><div class="label">Год основания</div><div th:text="${developer.foundedYear}"></div></div>
                <div class="field"><div class="label">Рейтинг</div><div class="rating" th:text="${developer.rating}"></div></div>
                <div class="field" th:if="${developer.website}">
                    <div class="label">Сайт</div>
                    <a th:href="${developer.website}" th:text="${developer.website}" target="_blank" style="color:#9cdcfe;"></a>
                </div>
            </div>
            <div class="field" th:if="${developer.description}">
                <div class="label">Описание</div>
                <div th:text="${developer.description}"></div>
            </div>
            <div style="margin-top:20px;">
                <a th:href="@{/developers/{id}/edit(id=${developer.id})}" class="btn">Редактировать</a>
            </div>
        </div>
    </div>
</body>
</html>
