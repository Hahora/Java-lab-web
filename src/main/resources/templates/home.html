<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>GameHub</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: #1a1a2e;
            color: #e0e0e0;
        }
        .header {
            background: #16213e;
            padding: 20px 40px;
            border-bottom: 2px solid #0f3460;
        }
        .header h1 {
            margin: 0;
            color: #e94560;
            font-size: 2em;
        }
        .hero {
            text-align: center;
            padding: 60px 20px;
        }
        .hero h2 {
            font-size: 2.5em;
            color: #e94560;
        }
        .hero p {
            font-size: 1.2em;
            color: #a0a0b0;
            max-width: 600px;
            margin: 0 auto 30px;
        }
        .btn {
            display: inline-block;
            padding: 12px 30px;
            background: #e94560;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-size: 1.1em;
            margin: 5px;
        }
        .btn:hover { background: #c73652; }
        .btn-secondary {
            background: #0f3460;
        }
        .btn-secondary:hover { background: #1a4a80; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🎮 GameHub</h1>
    </div>
    <div class="hero">
        <h2>Добро пожаловать в GameHub!</h2>
        <p>Система управления каталогом компьютерных игр и разработчиков</p>
        <a href="/games" class="btn">Каталог игр</a>
        <a href="/developers" class="btn btn-secondary">Разработчики</a>
    </div>
</body>
</html>
