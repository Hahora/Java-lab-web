<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>GameHub — Вход</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #1a1a2e; color: #e0e0e0;
               display: flex; flex-direction: column; min-height: 100vh; }
        .header { background: #16213e; padding: 15px 30px; border-bottom: 2px solid #0f3460; }
        .header h1 { margin: 0; color: #e94560; }
        .content { flex: 1; display: flex; align-items: center; justify-content: center; }
        .login-card { background: #16213e; border-radius: 10px; padding: 40px; width: 360px;
                      border: 1px solid #0f3460; box-shadow: 0 4px 24px rgba(0,0,0,0.4); }
        .login-card h2 { color: #e94560; margin-top: 0; text-align: center; }
        .form-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 6px; color: #9cdcfe; font-size: 0.9em; }
        input { width: 100%; padding: 10px; background: #1a1a2e; border: 1px solid #0f3460;
                color: #e0e0e0; border-radius: 4px; box-sizing: border-box; font-size: 1em; }
        input:focus { outline: none; border-color: #e94560; }
        .btn { width: 100%; padding: 12px; background: #e94560; color: white; border: none;
               border-radius: 4px; cursor: pointer; font-size: 1em; margin-top: 8px; }
        .btn:hover { background: #c73652; }
        .alert { padding: 10px 15px; border-radius: 4px; margin-bottom: 18px; font-size: 0.9em; }
        .alert-error { background: #3a1a2e; border: 1px solid #e94560; color: #e94560; }
        .alert-success { background: #1a3a2e; border: 1px solid #4caf50; color: #4caf50; }
        .hint { margin-top: 20px; padding: 12px; background: #0f3460; border-radius: 6px;
                font-size: 0.82em; color: #9cdcfe; }
        .hint strong { color: #e0e0e0; }
    </style>
</head>
<body>
    <div class="header"><h1>🎮 GameHub</h1></div>
    <div class="content">
        <div class="login-card">
            <h2>Вход в систему</h2>

            <div class="alert alert-error" th:if="${param.error}">
                Неверное имя пользователя или пароль.
            </div>
            <div class="alert alert-success" th:if="${param.logout}">
                Вы успешно вышли из системы.
            </div>

            <form method="post" th:action="@{/login}">
                <div class="form-group">
                    <label for="username">Имя пользователя</label>
                    <input type="text" id="username" name="username"
                           placeholder="Alex или Alice" required autofocus/>
                </div>
                <div class="form-group">
                    <label for="password">Пароль</label>
                    <input type="password" id="password" name="password"
                           placeholder="Введите пароль" required/>
                </div>
                <button type="submit" class="btn">Войти</button>
            </form>

            <div class="hint">
                <strong>Тестовые пользователи:</strong><br/>
                Alex / password<br/>
                Alice / password<br/>
                admin / admin123
            </div>
        </div>
    </div>
</body>
</html>
